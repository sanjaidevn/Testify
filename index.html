<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Paste Text Fields</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Global Copy/Paste Board</h1>
        <p>Changes are saved automatically. Anyone can read and edit.</p>
        <span id="status" class="status-indicator">Connecting...</span>
    </div>

    <div class="grid-container">
        <textarea id="box1" class="text-box" placeholder="Loading text field 1..."></textarea>
        <textarea id="box2" class="text-box" placeholder="Loading text field 2..."></textarea>
        <textarea id="box3" class="text-box" placeholder="Loading text field 3..."></textarea>
        <textarea id="box4" class="text-box" placeholder="Loading text field 4..."></textarea>
    </div>

    <script src="app.js"></script>
</body>
</html>
